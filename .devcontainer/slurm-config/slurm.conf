# slurm.conf file generated by configurator.html.
# Put this file on all nodes of your cluster.
# See the slurm.conf man page for more information.
#
# NOTE: This is the Slurm 25.11.x configuration
#
ClusterName=linux
SlurmctldHost=login-01
#SlurmctldHost=
#
#DisableRootJobs=NO
#EnforcePartLimits=NO
#Epilog=
#EpilogSlurmctld=
#FirstJobId=1
#MaxJobId=67043328
GresTypes=gpu
#GroupUpdateForce=0
#GroupUpdateTime=600
#JobFileAppend=0
#JobRequeue=1
JobSubmitPlugins=lua
#KillOnBadExit=0
#LaunchType=launch/slurm
#Licenses=foo*4,bar
#MailProg=/bin/mail
#MaxJobCount=10000
#MaxStepCount=40000
#MaxTasksPerNode=512
#MpiDefault=
#MpiParams=ports=#-#
#PluginDir=
#PlugStackConfig=
#PrivateData=jobs
ProctrackType=proctrack/linuxproc
#Prolog=
#PrologFlags=
#PrologSlurmctld=
#PropagatePrioProcess=0
#PropagateResourceLimits=
#PropagateResourceLimitsExcept=
#RebootProgram=
# =2 (not the default 1) so a node that reconnects after an unexpected
# reboot - e.g. every Codespace pause/resume cycle - is put back into
# service automatically instead of staying DOWN until a manual
# `scontrol update ... State=RESUME`.
ReturnToService=2
SlurmdParameters=config_overrides
MaxNodeCount=100
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurm
SlurmUser=slurm
#SlurmdUser=root
#SrunEpilog=
#SrunProlog=
StateSaveLocation=/var/lib/slurm
#SwitchType=
#TaskEpilog=
TaskPlugin=task/affinity
#TaskProlog=
#TopologyPlugin=topology/tree
#TmpFS=/tmp
#TrackWCKey=no
#TreeWidth=
#UnkillableStepProgram=
#UsePAM=0
#
#
# TIMERS
#BatchStartTimeout=10
#CompleteWait=0
#EpilogMsgTime=2000
#GetEnvTimeout=2
#HealthCheckInterval=0
#HealthCheckProgram=
InactiveLimit=0
KillWait=30
#MessageTimeout=10
#ResvOverRun=0
MinJobAge=300
#OverTimeLimit=0
SlurmctldTimeout=120
SlurmdTimeout=300
#UnkillableStepTimeout=60
#VSizeFactor=0
Waittime=0
#
#
# SCHEDULING
# Without a default, cons_tres grants a job with no --mem the whole
# node's memory, which can starve every other job sharing that node.
DefMemPerCPU=1024
#MaxMemPerCPU=0
#SchedulerTimeSlice=30
SchedulerType=sched/backfill
SelectType=select/cons_tres
#
#
# JOB PRIORITY
#PriorityFlags=
#PriorityType=priority/multifactor
#PriorityDecayHalfLife=
#PriorityCalcPeriod=
#PriorityFavorSmall=
#PriorityMaxAge=
#PriorityUsageResetPeriod=
#PriorityWeightAge=
#PriorityWeightFairshare=
#PriorityWeightJobSize=
#PriorityWeightPartition=
#PriorityWeightQOS=
#
#
# LOGGING AND ACCOUNTING
#AccountingStorageEnforce=0
AccountingStorageHost=slurmdbd
#AccountingStoragePass=
#AccountingStoragePort=
AccountingStorageType=accounting_storage/slurmdbd
#AccountingStorageUser=
#AccountingStoreFlags=
#JobCompHost=
JobCompLoc=/var/log/slurm/jobcomp.log
#JobCompParams=
#JobCompPass=
#JobCompPort=
JobCompType=jobcomp/filetxt
#JobCompUser=
#JobContainerType=
JobAcctGatherFrequency=30
#JobAcctGatherType=
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
#SlurmSchedLogFile=
#SlurmSchedLogLevel=
#DebugFlags=
#
# AUTHENTICATION
AuthType=auth/munge
#
# POWER SAVE SUPPORT FOR IDLE NODES (optional)
#SuspendProgram=
#ResumeProgram=
#SuspendTimeout=
#ResumeTimeout=
#ResumeRate=
#SuspendExcNodes=
#SuspendExcParts=
#SuspendRate=
#SuspendTime=
#
#
# COMPUTE NODES (all dynamic via slurmd -Z)
# Static node definitions removed - nodes self-register dynamically

NodeSet=cpu_nodes Feature=cpu
NodeSet=gpu_nodes Feature=gpu

# Job queues mirroring the CeMM cluster's partition names and time limits.
# Node counts and per-partition memory limits are NOT reproduced here -
# this sandbox runs 4 dynamic cpu workers (node001-node004) shared across
# all cpu partitions. No default partition is set, matching the CeMM
# cluster's requirement that --partition be given explicitly. The
# per-queue GrpJobs/MaxJobsPerUser limits are added as QOS objects
# after boot (see provision-slurm-queues.sh) rather than referenced
# here directly, since slurmctld validates any QOS=/AllowQOS= named
# on a partition against slurmdbd at startup and fails fatally if it
# doesn't exist yet - and the QOS objects can only be created once
# slurmdbd is already up. Pass --qos=<partition name> to pick them up.
# The "gpu" partition has no worker registered in this training
# environment; jobs submitted to it will stay PENDING.
PartitionName=tinyq        Nodes=cpu_nodes Default=NO MaxTime=02:00:00    DefaultTime=02:00:00    State=UP
PartitionName=interactiveq Nodes=cpu_nodes Default=NO MaxTime=12:00:00    DefaultTime=12:00:00    State=UP
PartitionName=develop      Nodes=cpu_nodes Default=NO MaxTime=01:00:00    DefaultTime=01:00:00    State=UP
PartitionName=shortq       Nodes=cpu_nodes Default=NO MaxTime=12:00:00    DefaultTime=12:00:00    State=UP
PartitionName=mediumq      Nodes=cpu_nodes Default=NO MaxTime=2-00:00:00  DefaultTime=2-00:00:00  State=UP
PartitionName=longq        Nodes=cpu_nodes Default=NO MaxTime=30-00:00:00 DefaultTime=00:01:00    State=UP
PartitionName=covid        Nodes=cpu_nodes Default=NO MaxTime=20-00:00:00 DefaultTime=01:00:00    State=UP
PartitionName=gpu          Nodes=gpu_nodes Default=NO MaxTime=3-00:00:00  DefaultTime=01:00:00    State=UP

# add JWT as an alternative authentication type
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key
