x-install-config: &install-config
  - "/bin/bash"
  - "-c"
  - >
    source /etc/slurm-custom/common-bootstrap.sh &&
    exec /usr/local/bin/docker-entrypoint.sh "$0" "$@"

services:
  mysql:
    image: mariadb:12
    hostname: mysql
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slurm_acct_db}
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  slurmdbd:
    image: giovtorres/slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    init: true
    entrypoint: *install-config
    command: ["slurmdbd"]
    container_name: slurmdbd
    hostname: slurmdbd
    environment:
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - ./slurm-config:/etc/slurm-custom:ro
    expose:
      - "6819"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmdbd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  slurmctld:
    image: giovtorres/slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    init: true
    entrypoint: *install-config
    command: ["slurmctld"]
    container_name: login-01
    hostname: login-01
    privileged: true
    working_dir: /workspaces/Introduction_to_Scientific_Computing
    volumes:
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - var_log_slurm:/var/log/slurm:z
      - ./slurm-config:/etc/slurm-custom:ro
      - ${localWorkspaceFolder:-..}:/workspaces/Introduction_to_Scientific_Computing:z
    expose:
      - "6817"
    depends_on:
      slurmdbd:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  cpu-worker:
    image: giovtorres/slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    init: true
    entrypoint: ["/bin/bash", "/etc/slurm-custom/start-cpu-worker.sh"]
    working_dir: /workspaces/Introduction_to_Scientific_Computing
    privileged: true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-slurm}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - ./slurm-config:/etc/slurm-custom:ro
      - ${localWorkspaceFolder:-..}:/workspaces/Introduction_to_Scientific_Computing:z
    expose:
      - "6818"
    depends_on:
      slurmctld:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: ${CPU_WORKER_COUNT:-4}

volumes:
  etc_munge:
  etc_slurm:
  var_lib_mysql:
  var_log_slurm:

networks:
  slurm-network:
    driver: bridge
